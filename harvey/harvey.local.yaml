    entry: "Piano Free: un corso e fino a 10 corsisti, senza costi"
    goal: "start_trial"             # iscrizione al piano Free o richiesta di demo
    booking_method: "ask_preference"
    booking_url: ""                 # TODO: se c'e' un calendario per le demo
    meeting_duration: "20 minutes"  # TODO: confermare
    meeting_owner: ""               # TODO: chi tiene la demo

