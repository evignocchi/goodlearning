    "abbiamo gia' un LMS": "Si integra con altre piattaforme e GoodContent AI esporta in SCORM dal piano Grow. Che cosa vorreste migliorare oggi?"
    "non siamo interessati": "Capito, grazie della risposta. Non scrivero' piu'."
